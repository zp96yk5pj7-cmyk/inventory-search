function search(){
  var kw = document.getElementById('kw').value.trim().toLowerCase();
  var stats = document.getElementById('stats');
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  
  if(!kw){
    list.innerHTML='';
    stats.className='stats';
    empty.className='empty show';
    empty.textContent='杈撳叆鍏抽敭璇嶆悳绱㈠簱瀛樻潗鏂?;
    return;
  }
  
  var results = [];
  for(var i=0;i<DATA.length;i++){
    var item = DATA[i];
    for(var j=0;j<SEARCH_FIELDS.length;j++){
      var f = SEARCH_FIELDS[j];
      var val = (item[f]||'').toString().toLowerCase();
      if(val.indexOf(kw) !== -1){
        results.push(item);
        break;
      }
    }
    if(results.length>=200) break;
  }
  
  stats.className = 'stats show';
  stats.textContent = '鍏?' + results.length + ' 鏉＄粨鏋?;
  
  if(results.length === 0){
    list.innerHTML='';
    empty.className='empty show';
    empty.textContent='鏈壘鍒板尮閰嶇殑搴撳瓨璁板綍';
  } else {
    empty.className='empty';
    var html = '';
    for(var i=0;i<results.length;i++){
      var r = results[i];
      var title = r['瑙勬牸鍨嬪彿'] || (r['鐗╂枡鍚嶇О'] + ' - ' + r['鐗╂枡浠ｇ爜']);
      html += '<div class="card" onclick="toggle('+i+')">';
      html += '<div class="card-top">';
      html += '<div class="card-info">';
      html += '<div class="card-model">'+esc(title)+'</div>';
      html += '<div class="card-meta">';
      html += '<span>'+esc(r['鐗╂枡浠ｇ爜']||'')+'</span>';
      html += '<span>'+esc(r['鍩烘湰鍗曚綅鏁伴噺']||'')+' '+esc(r['甯哥敤璁￠噺鍗曚綅']||'')+'</span>';
      html += '<span>'+esc(r['浠撳簱鍚嶇О']||'')+'</span>';
      html += '</div></div>';
      html += '<div class="card-arrow" id="arrow_'+i+'">鈻?/div>';
      html += '</div>';
      html += '<div class="card-detail" id="detail_'+i+'">';
      for(var k=0;k<ALL_FIELDS.length;k++){
        var f = ALL_FIELDS[k];
        var v = r[f];
        if(v === '' || v === null || v === undefined) continue;
        html += '<div class="detail-row"><span class="detail-label">'+f+'</span><span class="detail-value">'+esc(v)+'</span></div>';
      }
      html += '</div></div>';
    }
    list.innerHTML = html;
  }
}

function toggle(i){
  var d = document.getElementById('detail_'+i);
  var a = document.getElementById('arrow_'+i);
  if(d.className.indexOf('show')>-1){
    d.className='card-detail';
    a.className='card-arrow';
  } else {
    d.className='card-detail show';
    a.className='card-arrow open';
  }
}

function esc(s){
  s = String(s==null?'':s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
